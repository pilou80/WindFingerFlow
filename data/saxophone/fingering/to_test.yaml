# Common alternates that were missing. ALL TO TEST: none is validated by the saxophonist.
# Source: Woodwind Fingering Guide (T. Reichard), alternate-fingering charts. The codes were read from an automatic
# summary of the pages (the key diagrams are images), so each one must be checked against the page and by playing.
# Entries that depend on the octave key follow the register rules (it is added automatically from D5).
instrument_family: saxophone
