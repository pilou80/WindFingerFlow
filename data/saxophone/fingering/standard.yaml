# Standard chromatic fingerings, written pitch. The octave key is added by register rules.
# Low D to high C# (octave 2 = octave 1 + octave key). Palm keys and altissimo are not covered yet.
# Written from general knowledge of the standard fingering; to be checked against the cited source.
