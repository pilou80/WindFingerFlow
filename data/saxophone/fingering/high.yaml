# Palm-key register, written D6 to F#6 (the top of the standard range).
# Key roles from the Woodwind Fingering Guide: palm D is used for D, Eb, E, F, F#; palm Eb for Eb, E, F, F#;
# side E for E, F, F#; palm F for F, F#; the high F# key only for F#. Combinations are built cumulatively from
# these roles; the palm-key F# matches Sax Gourmet. Assumption to check: the octave key is added by the register
# rules (it is not stated by the sources). Altissimo above F#6 is not covered yet.
instrument_family: saxophone
fingerings:
  - id: d6.palm
    pitches: [D6]
    keys: [lh.palm_d]
    category: standard
    level: beginner
    validated: true
    intonation: sharp
    sources: [{ name: "Woodwind Fingering Guide (T. Reichard), key roles", url: "https://www.wfg.woodwind.org/sax/sax_fing.html" }, { name: "Intonation tendencies: Jagow (D'Addario), US Navy Band, The Instrumentalist" }]
  - id: eb6.palm
    pitches: [Eb6]
    keys: [lh.palm_d, lh.palm_eb]
    category: standard
    level: beginner
    validated: true
    intonation: sharp
    sources: [{ name: "Woodwind Fingering Guide (T. Reichard), key roles", url: "https://www.wfg.woodwind.org/sax/sax_fing.html" }, { name: "Intonation tendencies: Jagow (D'Addario), US Navy Band, The Instrumentalist" }]
  - id: e6.palm
    pitches: [E6]
    keys: [lh.palm_d, lh.palm_eb, rh.side_e]
    category: standard
    level: beginner
    validated: true
    intonation: sharp
    sources: [{ name: "Woodwind Fingering Guide (T. Reichard), key roles", url: "https://www.wfg.woodwind.org/sax/sax_fing.html" }, { name: "Intonation tendencies: Jagow (D'Addario), US Navy Band, The Instrumentalist" }]
  - id: f6.palm
    pitches: [F6]
    keys: [lh.palm_d, lh.palm_eb, lh.palm_f, rh.side_e]
    category: standard
    level: beginner
    validated: true
    intonation: sharp
    sources: [{ name: "Woodwind Fingering Guide (T. Reichard), key roles", url: "https://www.wfg.woodwind.org/sax/sax_fing.html" }, { name: "Intonation tendencies: Jagow (D'Addario), US Navy Band, The Instrumentalist" }]
  - id: fs6.palm
    pitches: [F#6]
    keys: [lh.palm_d, lh.palm_eb, lh.palm_f, rh.side_e, rh.high_fs]
    category: standard
    level: beginner
    validated: true
    sources: [{ name: "Woodwind Fingering Guide (T. Reichard), key roles", url: "https://www.wfg.woodwind.org/sax/sax_fing.html" }, { name: "Sax Gourmet, Using the High F# Key (P. Coats)", url: "https://www.saxgourmet.com/?p=177" }]
  - id: e6.fork
    pitches: [E6]
    keys: [lh.front_f, lh.a, lh.g]
    category: alternate
    level: expert  # pilou cannot play it yet, which does not make it wrong (2026-11-26)
    sources: [{ name: "Sax Gourmet, Using the High F# Key (P. Coats)", url: "https://www.saxgourmet.com/?p=177" }]
  - id: f6.front
    pitches: [F6]
    keys: [lh.front_f, lh.a]
    category: alternate
    level: advanced
    validated: true
    sources: [{ name: "Sax Gourmet, Using the High F# Key (P. Coats)", url: "https://www.saxgourmet.com/?p=177" }, { name: "Woodwind Fingering Guide (T. Reichard), key roles", url: "https://www.wfg.woodwind.org/sax/sax_fing.html" }]
  - id: fs6.fork
    pitches: [F#6]
    keys: [lh.front_f, lh.a, rh.high_fs]
    category: alternate
    level: advanced
    validated: true
    sources: [{ name: "Sax Gourmet, Using the High F# Key (P. Coats)", url: "https://www.saxgourmet.com/?p=177" }]
