family: saxophone
# Draft from design notes §5.3. Finger notation: L1-L4 / R1-R4 = index to little finger, LT = left thumb.
keys:
  - id: lh.octave
    name: { en: "Octave key", fr: "Clé d'octave" }
    finger: LT
    group: octave
    lilypond: { group: lh, name: T }
    availability: "all"
  - id: lh.front_f
    name: { en: "Front F", fr: "Fa fourche (clé avant)" }
    finger: L1
    group: main
    lilypond: { group: lh, name: front-f }
    availability: "all (not some old models)"
  - id: lh.palm_d
    name: { en: "Palm D", fr: "Clé de paume Ré" }
    finger: L1
    group: palm
    lilypond: { group: lh, name: d }
    availability: "all"
    description: "Pressed with the index knuckle; the palm is a substitute."
  - id: lh.palm_eb
    name: { en: "Palm Eb", fr: "Clé de paume Mib" }
    finger: L1
    group: palm
    lilypond: { group: lh, name: ees }
    availability: "all"
    description: "Pressed with the first joint of the index."
  - id: lh.palm_f
    name: { en: "Palm F", fr: "Clé de paume Fa" }
    finger: L2
    group: palm
    lilypond: { group: lh, name: f }
    availability: "all"
    description: "Pressed with the first joint of the middle finger."
  - id: lh.b
    name: { en: "B key", fr: "Clé de Si" }
    finger: L1
    group: main
    lilypond: { group: cc, name: one }
    availability: "all"
  - id: lh.bis
    name: { en: "Bis key", fr: "Clé de Sib bis" }
    finger: L1
    group: main
    lilypond: { group: lh, name: bes }
    availability: "all"
    description: "Pressed with the same finger as the B key."
  - id: lh.a
    name: { en: "A key", fr: "Clé de La" }
    finger: L2
    group: main
    lilypond: { group: cc, name: two }
    availability: "all"
  - id: lh.g
    name: { en: "G key", fr: "Clé de Sol" }
    finger: L3
    group: main
    lilypond: { group: cc, name: three }
    availability: "all"
  - id: lh.gs
    name: { en: "G# key", fr: "Clé de Sol#" }
    finger: L4
    group: pinky
    lilypond: { group: lh, name: gis }
    availability: "all"
  - id: lh.low_cs
    name: { en: "Low C#", fr: "Do# grave" }
    finger: L4
    group: pinky
    lilypond: { group: lh, name: cis }
    availability: "all"
  - id: lh.low_b
    name: { en: "Low B", fr: "Si grave" }
    finger: L4
    group: pinky
    lilypond: { group: lh, name: b }
    availability: "all"
  - id: lh.low_bb
    name: { en: "Low Bb", fr: "Sib grave" }
    finger: L4
    group: pinky
    lilypond: { group: lh, name: low-bes }
    availability: "all"
  - id: lh.low_a
    name: { en: "Low A", fr: "La grave" }
    finger: LT
    group: thumb
    lilypond: { group: lh, name: low-a }
    availability: "baritone only"
  - id: rh.f
    name: { en: "F key", fr: "Clé de Fa" }
    finger: R1
    group: main
    lilypond: { group: cc, name: four }
    availability: "all"
  - id: rh.e
    name: { en: "E key", fr: "Clé de Mi" }
    finger: R2
    group: main
    lilypond: { group: cc, name: five }
    availability: "all"
  - id: rh.d
    name: { en: "D key", fr: "Clé de Ré" }
    finger: R3
    group: main
    lilypond: { group: cc, name: six }
    availability: "all"
  - id: rh.alt_fs
    name: { en: "Alternate F#", fr: "Fa# alternatif" }
    finger: R3
    group: main
    lilypond: { group: rh, name: fis }
    availability: "all"
    description: "Used for the alternate F#; fingering validated by pilou (2026-11-26)."
  - id: rh.side_e
    name: { en: "Side E (high E)", fr: "Mi aigu latéral" }
    finger: R1
    group: side
    lilypond: { group: rh, name: e }
    availability: "all"
  - id: rh.side_c
    name: { en: "Side C", fr: "Do latéral" }
    finger: R1
    group: side
    lilypond: { group: rh, name: c }
    availability: "all"
  - id: rh.side_bb
    name: { en: "Side Bb", fr: "Sib de côté" }
    finger: R1
    group: side
    lilypond: { group: rh, name: bes }
    availability: "all"
  - id: rh.high_fs
    name: { en: "High F# (4th side key)", fr: "Fa# aigu (4e clé latérale)" }
    finger: R1
    group: side
    lilypond: { group: rh, name: high-fis }
    availability: "most modern models"
  - id: rh.low_eb
    name: { en: "Low Eb", fr: "Mib grave" }
    finger: R4
    group: pinky
    lilypond: { group: rh, name: ees }
    availability: "all"
    description: "Upper pinky key of the right hand."
  - id: rh.low_c
    name: { en: "Low C", fr: "Do grave" }
    finger: R4
    group: pinky
    availability: "all"
    description: "Lower pinky key of the right hand. LilyPond name to check."
    needs_confirmation: true
