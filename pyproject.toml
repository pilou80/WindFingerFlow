[project]
name = "windfingerflow"
version = "0.0.1"
description = "Suggests alternate woodwind fingerings for a score and returns an annotated PDF/MusicXML."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "cairosvg>=2.9.1",
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "music21>=10.5.2",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
    "verovio>=6.4.1",
]

[project.scripts]
windfingerflow = "windfingerflow.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windfingerflow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
