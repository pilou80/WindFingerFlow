# More alternates (design notes §12 "Additional alternates"), in our own words.
# Only entries whose keys exist in the catalogue and are clear enough are included.
# Palm-key and venting alternates still need exact keys and sources.
instrument_family: saxophone
fingerings:
  - id: c.side
    pitches: [C5, C6]
    keys: [lh.b, rh.side_c]
    category: alternate
    level: advanced
    validated: true
    intonation: flat
    sources: [{ name: "Dawkes, saxophone fingerings: a complete guide to alternatives", url: "https://www.dawkes.co.uk/sound-room/saxophone-fingerings-a-complete-guide-to-alternatives/" }]
  - id: d.long
    pitches: [D5]
    keys: [lh.a, lh.palm_d]
    category: alternate
    level: expert  # pilou cannot play it yet, which does not make it wrong (2026-11-26)
    needs_confirmation: true
    sources: [{ name: "Dawkes, saxophone fingerings: a complete guide to alternatives", url: "https://www.dawkes.co.uk/sound-room/saxophone-fingerings-a-complete-guide-to-alternatives/" }]
