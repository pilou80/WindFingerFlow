# Bb / A# alternates (written pitches, lower register; octave key added by register rules).
# Draft from design notes §12, rewritten in our own words. Intonation still to measure.
instrument_family: saxophone
fingerings:
  - id: bb.bis
    pitches: [Bb4, Bb5]
    keys: [lh.b, lh.bis]
    category: standard
    level: beginner
    sources: [{ name: "Dawkes, Saxophone fingerings ultimate guide (A. Penman)", url: "https://www.dawkes.co.uk/sound-room/saxophone-fingerings-ultimate-guide/" }, { name: "Corrected by the saxophonist (pilou), 2026-11-26: no A key" }]
  - id: bb.one_one
    pitches: [Bb4, Bb5]
    keys: [lh.b, rh.f]
    category: alternate
    level: advanced
    sources: [{ name: "Early design-notes draft; confirmed by playing, see the trial files" }]
  - id: bb.side
    pitches: [Bb4, Bb5]
    keys: [lh.b, lh.a, rh.side_bb]
    category: alternate
    level: beginner
    sources: [{ name: "Dawkes, Saxophone fingerings ultimate guide (A. Penman)", url: "https://www.dawkes.co.uk/sound-room/saxophone-fingerings-ultimate-guide/" }]
