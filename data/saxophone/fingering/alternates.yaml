# More alternates (design notes §12 "Additional alternates"), in our own words.
# Only entries whose keys exist in the catalogue and are clear enough are included.
# Palm-key and venting alternates still need exact keys and sources.
instrument_family: saxophone
fingerings:
  - id: c.side
    pitches: [C5, C6]
    keys: [lh.b, rh.side_c]
    category: alternate
    level: advanced
    intonation: flat
    sources: [{ name: "Dawkes, saxophone fingerings: a complete guide to alternatives", url: "https://www.dawkes.co.uk/sound-room/saxophone-fingerings-a-complete-guide-to-alternatives/" }]
  - id: d.long
    pitches: [D5]
    keys: [lh.a, lh.palm_d]
    category: alternate
    level: expert  # pilou cannot play it yet, which does not make it wrong (2026-11-26)
    needs_confirmation: true
    sources: [{ name: "Dawkes, saxophone fingerings: a complete guide to alternatives", url: "https://www.dawkes.co.uk/sound-room/saxophone-fingerings-a-complete-guide-to-alternatives/" }]
  - id: c.a_g_gs
    pitches: [C5, C6]
    keys: [lh.a, lh.g, lh.gs]
    category: alternate
    level: advanced
    sources: [{ name: "WFG alternate chart, code -23G#|---", url: "https://www.wfg.woodwind.org/sax/sax_alt_1.html" }]
  - id: f6.b_a_side_e
    pitches: [F6]
    keys: [lh.b, lh.a, rh.side_e]
    category: alternate
    level: experimental
    sources: [{ name: "WFG alternate chart, code T 12-|E---", url: "https://www.wfg.woodwind.org/sax/sax_alt_2.html" }]
  - id: f6.high_fs
    pitches: [F6]
    keys: [rh.high_fs]
    category: alternate
    level: expert
    sources: [{ name: "WFG alternate chart, code T ---|f#---", url: "https://www.wfg.woodwind.org/sax/sax_alt_2.html" }]
  - id: gs.low_cs
    pitches: [G#4, G#5]
    keys: [lh.b, lh.a, lh.g, lh.low_cs]
    category: alternate
    level: advanced
    sources: [{ name: "WFG alternate chart, code 123C#|---", url: "https://www.wfg.woodwind.org/sax/sax_alt_1.html" }]
  - id: gs.low_b
    pitches: [G#4, G#5]
    keys: [lh.b, lh.a, lh.g, lh.low_b]
    category: alternate
    level: advanced
    sources: [{ name: "WFG alternate chart, code 123B|---", url: "https://www.wfg.woodwind.org/sax/sax_alt_1.html" }]
  - id: gs.low_bb
    pitches: [G#4, G#5]
    keys: [lh.b, lh.a, lh.g, lh.low_bb]
    category: alternate
    level: advanced
    sources: [{ name: "WFG alternate chart, code 123Bb|---", url: "https://www.wfg.woodwind.org/sax/sax_alt_1.html" }]
