# Texts of the saxophone data in 'fr': names of the keys and fingerings, descriptions, use / avoid.
# One file per language; add a new language by adding a file with the same ids.
keys:
  lh.octave:
    name: Clé d'octave
    availability: toutes
  lh.front_f:
    name: Fa fourche (clé avant)
    availability: toutes (sauf certains anciens modèles)
  lh.palm_d:
    name: Clé de paume Ré
    abbr: C1
    availability: toutes
    description: Se joue avec la jointure de l'index ; la paume peut la remplacer.
  lh.palm_eb:
    name: Clé de paume Mib
    abbr: C2
    availability: toutes
    description: Se joue avec la première phalange de l'index.
  lh.palm_f:
    name: Clé de paume Fa
    availability: toutes
    description: Se joue avec la première phalange du majeur.
  lh.b:
    name: Clé de Si
    availability: toutes
  lh.bis:
    name: Clé de Sib bis
    availability: toutes
    description: Se joue avec le même doigt que la clé de Si.
  lh.a:
    name: Clé de La
    availability: toutes
  lh.g:
    name: Clé de Sol
    availability: toutes
  lh.gs:
    name: Clé de Sol#
    availability: toutes
  lh.low_cs:
    name: Do# grave
    availability: toutes
  lh.low_b:
    name: Si grave
    availability: toutes
  lh.low_bb:
    name: Sib grave
    availability: toutes
  lh.low_a:
    name: La grave
    availability: baryton seulement
  rh.f:
    name: Clé de Fa
    availability: toutes
  rh.e:
    name: Clé de Mi
    availability: toutes
  rh.d:
    name: Clé de Ré
    availability: toutes
  rh.alt_fs:
    name: Fa# alternatif
    abbr: Tf
    availability: toutes
    description: Sert au Fa# alternatif ; doigté validé par pilou (2026-11-26).
  rh.side_e:
    name: Mi aigu latéral
    abbr: C3
    availability: toutes
  rh.side_c:
    name: Do latéral
    abbr: Tc
    availability: toutes
  rh.side_bb:
    name: Sib de côté
    abbr: Ta
    availability: toutes
  rh.high_fs:
    name: Fa# aigu (4e clé latérale)
    availability: la plupart des modèles récents
  rh.low_eb:
    name: Mib grave
    availability: toutes
    description: Clé haute de l'auriculaire droit.
  rh.low_c:
    name: Do grave
    availability: toutes
    description: Clé basse de l'auriculaire droit. Aussi enfoncée pour le Sib, le Si et le Do# graves (validé par pilou, 2026-11-26).
fingerings:
  c.side:
    name: Do latéral
    use: Passages rapides autour du Si et du Do, où il évite de bouger les deux mains.
    avoid: 'Notes lentes et exposées : il est souvent plus bas que le doigté standard.'
  d.long:
    name: Ré long
    use: Passages entre Do et Ré en changeant peu de doigts.
  g6.alt:
    name: Sol aigu (Fa avant + Sib côté)
    use: 'Altissimo. À tester : la réponse dépend beaucoup de l''instrument et du bec.'
  gs6.alt:
    name: Sol# aigu (Si + Sol)
    use: Altissimo. À tester.
  a6.alt:
    name: La aigu (La + Sol)
    use: Altissimo. À tester.
  bb6.alt:
    name: Sib aigu (Sol)
    use: Altissimo. À tester.
  b6.alt:
    name: Si aigu (six doigts)
    use: Altissimo. À tester.
  c7.alt:
    name: Do aigu (Si+Sol, Fa+Ré)
    use: Altissimo. À tester.
  bb.bis:
    name: Sib bis
    use: Tonalités à bémols, quand aucun Si naturel n'est proche.
    avoid: Passages Si-Sib, où l'index doit rouler entre deux clés.
  bb.one_one:
    name: Sib 1+1
    use: Polyvalent ; la main droite est déjà en place.
    avoid: Passages rapides où R1 doit bouger vite.
  bb.side:
    name: Sib de côté
    use: Passages chromatiques Si-Sib-Si, trilles La-Sib.
    avoid: Tonalités très bémolisées quand une option plus simple existe.
  fs.std:
    name: Fa# standard
    use: Cas général.
  fs.alt:
    name: Fa# alternatif
    use: Passages Fa-Fa#, trilles Fa-Fa#, lignes chromatiques Mi-Fa-Fa#.
    avoid: Notes lentes et exposées, tant que la justesse n'a pas été vérifiée.
  d6.palm:
    name: Ré aigu (paume)
    use: 'Registre des clés de paume. À vérifier avec un accordeur : les notes de paume varient beaucoup selon les instruments.'
  eb6.palm:
    name: Mib aigu (paume)
    use: 'Registre des clés de paume. À vérifier avec un accordeur : les notes de paume varient beaucoup selon les instruments.'
  e6.palm:
    name: Mi aigu (paume)
    use: 'Registre des clés de paume. À vérifier avec un accordeur : les notes de paume varient beaucoup selon les instruments.'
  f6.palm:
    name: Fa aigu (paume)
    use: 'Registre des clés de paume. À vérifier avec un accordeur : les notes de paume varient beaucoup selon les instruments.'
  fs6.palm:
    name: Fa# aigu (paume)
    use: 'Registre des clés de paume. À vérifier avec un accordeur : les notes de paume varient beaucoup selon les instruments.'
  e6.fork:
    name: Mi fourche
    use: Sans les clés de paume. Fonctionne au soprano, à l'alto et au ténor ; au baryton et sur certains ténors, ajouter
      la clé de Mi (R2) pour le mettre en place.
  f6.front:
    name: Fa avant
    use: Alternative aux clés de paume pour le Fa aigu.
    avoid: 'Jouable mais exigeant : il demande des efforts pour sortir (validé par pilou, 2026-11-26).'
  fs6.fork:
    name: Fa# fourche
    use: Doigté de Fa avant avec la clé de Fa# aigu ajoutée. Demande une clé de Fa# aigu (la plupart des modèles récents).
    avoid: 'Jouable mais exigeant : il demande des efforts pour sortir (validé par pilou, 2026-11-26).'
  bb.low:
    name: Sib grave
  b.low:
    name: Si grave
  c.low:
    name: Do grave
  cs.low:
    name: Do# grave
  d.std:
    name: Ré
  eb.std:
    name: Mib
  e.std:
    name: Mi
  f.std:
    name: Fa
  g.std:
    name: Sol
  gs.std:
    name: Sol#
  a.std:
    name: La
  b.std:
    name: Si
  c.std:
    name: Do
  cs.std:
    name: Do#
